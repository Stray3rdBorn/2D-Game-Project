{% extends "base.html" %} {% block content %}
<h1>Top 10</h1>
<table border="1" cellpadding="6">
  <tr>
    <th>Rank</th>
    <th>Player</th>
    <th>Score</th>
    <th>Wave</th>
    <th>Won</th>
  </tr>
  {% for s in scores %}
  <tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ s.player_name }}</td>
    <td>{{ s.score }}</td>
    <td>{{ s.wave_reached }}</td>
    <td>{{ s.won|yesno:"Yes,No" }}</td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="5">No scores yet.</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
